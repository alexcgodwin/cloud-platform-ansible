---
- name: Check scope of managed-node configuration
  hosts: linux_servers
  gather_facts: false
  tasks:
    - name: Require explicitly permitted environment
      ansible.builtin.assert:
        that:
          - environment_name in ['dev', 'test', 'prod']
          - environment_name != 'prod' or (approve_production_configuration | default(false) | bool)
        fail_msg: "Production automation must be explicitly authorized."
    - name: Restrict inherited SSH access to declared user
      ansible.builtin.assert:
        that:
          - ansible_user is defined
          - ansible_user | length > 0
