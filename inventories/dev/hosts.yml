all:
  children:
    linux_servers:
      hosts:
        node1:
          ansible_host: node1
        node2:
          ansible_host: node2

      vars:
        ansible_user: ansible
        ansible_port: 22
        ansible_ssh_private_key_file: /root/.ssh/ansible_lab
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null